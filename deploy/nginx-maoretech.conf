# Config nginx pour MaoreTech — reverse proxy vers l'app Docker (127.0.0.1:3000).
#
# Sans domaine : ce bloc est le "default_server" → répond sur http://IP_DU_VPS
# sans gêner les autres sites (qui, eux, répondent sur leurs domaines).
#
# Installation sur le VPS :
#   sudo cp deploy/nginx-maoretech.conf /etc/nginx/sites-available/maoretech
#   sudo ln -sf /etc/nginx/sites-available/maoretech /etc/nginx/sites-enabled/maoretech
#   sudo nginx -t && sudo systemctl reload nginx
#
# Plus tard, avec un domaine : remplace "default_server" par "server_name mondomaine.com;"
# puis  sudo certbot --nginx -d mondomaine.com  pour le HTTPS.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
