# MaoreTech — déploiement VPS derrière un nginx existant.
# Base de données : Postgres hébergé sur Neon (DATABASE_URL dans .env).
# L'app écoute uniquement en local (127.0.0.1:3005) ; le nginx du serveur
# lui transmet le trafic (voir deploy/nginx-maoretech.conf).
# Lancer : docker compose up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
    ports:
      # Exposé seulement en local : nginx (sur l'hôte) fait le reverse proxy.
      # Port hôte 3005 (3000 et 3001 déjà pris par d'autres sites du VPS).
      - "127.0.0.1:3005:3000"
